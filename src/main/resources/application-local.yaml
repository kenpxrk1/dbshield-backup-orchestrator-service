server:
  port: 8087

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/dbshield
    username: dbshield
    password: dbshield
    hikari:
      schema: backup_service

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: backup_service
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: backup_service
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092

jwt:
