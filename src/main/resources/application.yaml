spring:
  application:
    name: dbshield-backup-orchestrator-service

  profiles:
    active: local

  kafka:

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.in.flight.requests.per.connection: 5

    consumer:
      group-id: backup-orchestrator
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "db.shield.backup.orchestrator.service.dto.event"


    listener:
      ack-mode: record
      concurrency: 6
      no-poll-threshold: 300000

outbox:
  enabled: ${OUTBOX_ENABLED:true}
  dispatcher:
    fixed-delay-ms: ${OUTBOX_DISPATCHER_FIXED_DELAY_MS:2000}
    batch-size: ${OUTBOX_DISPATCHER_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_DISPATCHER_MAX_ATTEMPTS:50}
    initial-backoff-ms: ${OUTBOX_DISPATCHER_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${OUTBOX_DISPATCHER_MAX_BACKOFF_MS:60000}
