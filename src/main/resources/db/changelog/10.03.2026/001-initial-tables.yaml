databaseChangeLog:

  - changeSet:
      id: 2026.02.11-1
      author: kenpxrkasf@gmail.com

      changes:

        - createTable:
            tableName: backup_job

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true

              - column:
                  name: database_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: db_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: requested_at
                  type: TIMESTAMP

              - column:
                  name: started_at
                  type: TIMESTAMP

              - column:
                  name: completed_at
                  type: TIMESTAMP

              - column:
                  name: retry_count
                  type: INT
                  defaultValueNumeric: 0

              - column:
                  name: error_message
                  type: TEXT

        - createIndex:
            tableName: backup_job
            indexName: idx_backup_job_database
            columns:
              - column:
                  name: database_id

        - createIndex:
            tableName: backup_job
            indexName: idx_backup_job_status
            columns:
              - column:
                  name: status

  - changeSet:
      id: 2026.02.11-2
      author: kenpxrkasf@gmail.com

      changes:

        - createTable:
            tableName: backup_schedule

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true

              - column:
                  name: database_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: cron_expression
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true

  - changeSet:
      id: 2026.02.11-3
      author: kenpxrkasf@gmail.com

      changes:

        - createTable:
            tableName: backup_result

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true

              - column:
                  name: job_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: file_path
                  type: TEXT

              - column:
                  name: file_size
                  type: BIGINT

              - column:
                  name: checksum
                  type: VARCHAR(255)

        - createIndex:
            tableName: backup_result
            indexName: idx_backup_result_job
            columns:
              - column:
                  name: job_id
